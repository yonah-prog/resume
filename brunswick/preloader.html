<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brunswick — Preloader Demo</title>
<style>
  /* ============================================================
     BRUNSWICK PRELOADER
     Copy everything between the PRELOADER START/END markers
     (both the CSS and the #bw-preloader markup) into any page.
     Timeline (~1.5s total):
       0ms    top face drops in
       90ms   left face slides in
       180ms  right face slides in
       420ms  wordmark fades up
       560ms  tagline fades up
       1150ms whole overlay lifts away
     ============================================================ */

  /* ---------- PRELOADER START ---------- */
  #bw-preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    animation: bw-lift .45s cubic-bezier(.65,0,.35,1) 1.15s forwards;
    pointer-events: none;
  }
  #bw-preloader svg {
    width: min(320px, 60vw);
    height: auto;
    overflow: visible;
  }
  #bw-preloader .bw-face,
  #bw-preloader .bw-word,
  #bw-preloader .bw-tag {
    opacity: 0;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(.22,1,.36,1);
  }
  #bw-preloader .bw-face-top   { animation: bw-drop  .5s  0s    forwards cubic-bezier(.22,1,.36,1); }
  #bw-preloader .bw-face-left  { animation: bw-left  .5s  .09s  forwards cubic-bezier(.22,1,.36,1); }
  #bw-preloader .bw-face-right { animation: bw-right .5s  .18s  forwards cubic-bezier(.22,1,.36,1); }
  #bw-preloader .bw-word       { animation: bw-rise  .45s .42s  forwards cubic-bezier(.22,1,.36,1); }
  #bw-preloader .bw-tag        { animation: bw-rise  .45s .56s  forwards cubic-bezier(.22,1,.36,1); }

  @keyframes bw-drop {
    from { opacity: 0; transform: translateY(-28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bw-left {
    from { opacity: 0; transform: translate(-28px, 16px); }
    to   { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes bw-right {
    from { opacity: 0; transform: translate(28px, 16px); }
    to   { opacity: 1; transform: translate(0, 0); }
  }
  @keyframes bw-rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bw-lift {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-3%); visibility: hidden; }
  }
  @media (prefers-reduced-motion: reduce) {
    #bw-preloader .bw-face, #bw-preloader .bw-word, #bw-preloader .bw-tag {
      animation: none; opacity: 1;
    }
    #bw-preloader { animation: bw-lift .3s ease .8s forwards; }
  }
  /* ---------- PRELOADER END ---------- */

  /* Demo page styling (not part of the preloader) */
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #fafafa; color: #111; }
  .demo {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;
  }
  .demo h1 { font-size: 15px; letter-spacing: .35em; text-transform: uppercase; font-weight: 600; margin: 0; }
  .demo p { color: #6b6b6b; font-size: 13px; max-width: 46ch; line-height: 1.7; margin: 0; }
  .demo button {
    margin-top: 12px; padding: 12px 28px; background: #111; color: #fff; border: 0;
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase; cursor: pointer;
  }
  .demo button:hover { background: #333; }
</style>
</head>
